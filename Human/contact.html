<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Contact — Quentin Mélotte</title>
    <script src="../js/navigation.js"></script>

    <link rel="stylesheet" href="./human.css">

</head>


<body>

    <!-- =====================================================
         NAVIGATION
         ===================================================== -->

    <div id="navbar"></div>


    <!-- =====================================================
         CONTACT
         ===================================================== -->

    <main class="contact-page">

        <div class="contact-header">

            <span class="section-number">
                07
            </span>

            <h1>
                Contact Me
            </h1>

            <p>
                Find me on these platforms.
            </p>

        </div>


        <div class="contact-grid">


            <!-- GitHub -->

            <a
                href="https://github.com/Nayggets"
                class="contact-card"
                target="_blank"
                rel="noopener noreferrer"
            >

                <img
                    src="../assets/Github.svg"
                    alt="GitHub"
                >

                <div class="contact-card-content">

                    <span class="contact-platform">
                        GITHUB
                    </span>

                    <span class="contact-name">
                        Nayggets
                    </span>

                </div>

                <span class="contact-arrow">
                    →
                </span>

            </a>



            <!-- Email -->

            <a
                href="mailto:quentin.melotte@gmail.com"
                class="contact-card"
            >

                <img
                    src="../assets/email.svg"
                    alt="Email"
                >

                <div class="contact-card-content">

                    <span class="contact-platform">
                        EMAIL
                    </span>

                    <span class="contact-name">
                        quentin.melotte@gmail.com
                    </span>

                </div>

                <span class="contact-arrow">
                    →
                </span>

            </a>



            <!-- LinkedIn -->

            <a
                href="https://www.linkedin.com/in/quentin-m%C3%A9lotte-nayggets/"
                class="contact-card"
                target="_blank"
                rel="noopener noreferrer"
            >

                <img
                    src="../assets/linkedin.svg"
                    alt="LinkedIn"
                >

                <div class="contact-card-content">

                    <span class="contact-platform">
                        LINKEDIN
                    </span>

                    <span class="contact-name">
                        Quentin Mélotte
                    </span>

                </div>

                <span class="contact-arrow">
                    →
                </span>

            </a>



            <!-- Google Scholar -->

            <a
                href="https://scholar.google.com/citations?user=YOUR_ID"
                class="contact-card"
                target="_blank"
                rel="noopener noreferrer"
            >

                <img
                    src="../assets/google-scholar.svg"
                    alt="Google Scholar"
                >

                <div class="contact-card-content">

                    <span class="contact-platform">
                        GOOGLE SCHOLAR
                    </span>

                    <span class="contact-name">
                        Quentin Mélotte
                    </span>

                </div>

                <span class="contact-arrow">
                    →
                </span>

            </a>


        </div>

    </main>


    <script src="../js/components.js"></script>

</body>

</html>
