<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>QM Portfolio</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/png" href="assets/favicon.png" />
</head>

<body>
<svg viewBox="0 0 800 800" class="bg-svg" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="cpuShape">
      <rect x="-15" y="-15" width="30" height="30" rx="3" fill="#00f0ff" stroke="#0ff" stroke-width="2" />
      <!-- Pins -->
      <rect x="-20" y="-12" width="5" height="4" fill="#0ff" />
      <rect x="-20" y="-2" width="5" height="4" fill="#0ff" />
      <rect x="-20" y="8" width="5" height="4" fill="#0ff" />
      <rect x="15" y="-12" width="5" height="4" fill="#0ff" />
      <rect x="15" y="-2" width="5" height="4" fill="#0ff" />
      <rect x="15" y="8" width="5" height="4" fill="#0ff" />
      <rect x="-12" y="-20" width="4" height="5" fill="#0ff" />
      <rect x="-2" y="-20" width="4" height="5" fill="#0ff" />
      <rect x="8" y="-20" width="4" height="5" fill="#0ff" />
      <rect x="-12" y="15" width="4" height="5" fill="#0ff" />
      <rect x="-2" y="15" width="4" height="5" fill="#0ff" />
      <rect x="8" y="15" width="4" height="5" fill="#0ff" />
    </g>
  </defs>

  <!-- Processors -->
  <g id="cpu1" class="cpu" transform="translate(100, 100)"><use href="#cpuShape"/></g>
  <g id="cpu2" class="cpu" transform="translate(300, 80)"><use href="#cpuShape"/></g>
  <g id="cpu3" class="cpu" transform="translate(500, 120)"><use href="#cpuShape"/></g>
  <g id="cpu4" class="cpu" transform="translate(150, 300)"><use href="#cpuShape"/></g>
  <g id="cpu5" class="cpu" transform="translate(400, 300)"><use href="#cpuShape"/></g>
  <g id="cpu6" class="cpu" transform="translate(600, 300)"><use href="#cpuShape"/></g>
  <g id="cpu7" class="cpu" transform="translate(350, 500)"><use href="#cpuShape"/></g>

  <!-- Links (all red by default) -->
  <line id="l1" x1="100" y1="100" x2="300" y2="80" class="link"/>
  <line id="l2" x1="300" y1="80" x2="500" y2="120" class="link"/>
  <line id="l3" x1="500" y1="120" x2="400" y2="300" class="link"/>
  <line id="l4" x1="400" y1="300" x2="150" y2="300" class="link"/>
  <line id="l5" x1="400" y1="300" x2="600" y2="300" class="link"/>
  <line id="l6" x1="400" y1="300" x2="350" y2="500" class="link"/>
  <line id="l7" x1="150" y1="300" x2="350" y2="500" class="link"/>
</svg>

  <nav>
	  <button onclick="showSection('About Me')">About Me</button>
	  <button onclick="showSection('Resume')">Resume</button>
	  <button onclick="showSection('Formation')">Formation</button>
	  <button onclick="showSection('Projects')">Projects</button>
	  <button onclick="showSection('Skills')">Skills</button>
	  <button onclick="showSection('Certifications')">Certifications</button>
	  <button onclick="showSection('Social')">Social/Hobbies</button>
	  <button onclick="showSection('Ambition')">Ambition</button>
	  <button onclick="showSection('Events')">Events</button>
	  <button onclick="showSection('Bibliotemple')">Bibliotemple</button>
  </nav>

  <div id="terminal">
    <span class="blinking-cursor"></span>
  </div>

  <script src="js/terminal.js"></script>
</body>
</html>
